name: Java CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resonance_store_ref:
        description: 'Monada Resonance Store ref for the adapter job (branch, tag or commit SHA)'
        required: false
        default: main

permissions:
  contents: read

concurrency:
  # The event is part of the group so a manual reproduce run never cancels a push or pull request run.
  group: java-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (Java 27)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run all project checks
        run: ./gradlew --no-daemon check

      - name: Verify external library consumer
        run: ./gradlew --no-daemon consumerSmokeTest

      - name: Verify JPMS module consumer
        run: ./gradlew --no-daemon jpmsConsumerTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  adapter:
    # Runs the optional adapter module, which is part of the build only when the Store sits next to this
    # repository (ADR 0018). It tracks Store main while the Store evolves; the tested Store commit is
    # recorded in the job summary, with the tested Neuron commit, so a run can be reproduced.
    name: Resonance Store adapter (Java 27, Store main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: monada-neuron
          # Store build scripts run in this job; keep the job token off disk.
          persist-credentials: false

      - name: Check out Monada Resonance Store
        uses: actions/checkout@v7
        with:
          repository: stevdrey/monada-resonance-store
          ref: ${{ inputs.resonance_store_ref || 'main' }}
          path: monada-resonance-store
          persist-credentials: false

      - name: Record tested revisions
        env:
          NEURON_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          sha="$(git -C monada-resonance-store rev-parse HEAD)"
          subject="$(git -C monada-resonance-store log -1 --format=%s)"
          # Workflow command data must escape %, CR and LF; % first so the other escapes survive.
          escaped="${subject//'%'/%25}"
          escaped="${escaped//$'\r'/%0D}"
          escaped="${escaped//$'\n'/%0A}"
          echo "::notice title=Resonance Store revision::${sha} ${escaped}"
          {
            echo "### Tested revisions"
            echo ""
            echo "- Neuron commit (\`${EVENT_NAME}\`; the merge commit for pull requests): \`${NEURON_SHA}\`"
            echo "- Store commit: [\`${sha}\`](https://github.com/stevdrey/monada-resonance-store/commit/${sha})"
            echo "- Store subject: \`${subject//\`/}\`"
            echo ""
            echo "Reproduce locally: check out Neuron at the commit above with \`../monada-resonance-store\` at the Store"
            echo "commit, then run \`./gradlew :monada-neuron-resonance-adapter:test\`. A manual run of this workflow with"
            echo "\`resonance_store_ref=${sha}\` re-tests a branch head, not a pull request merge commit, and is not"
            echo "available for pull requests from forks."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assert Store checkout is in the sibling layout
        # settings.gradle.kts includes the adapter only when this file exists; if the module is still missing,
        # the test task below fails with "project not found".
        run: |
          if [ ! -f monada-resonance-store/settings.gradle.kts ]; then
            echo "::error::monada-resonance-store/settings.gradle.kts is missing; the adapter module would not be part of the build."
            exit 1
          fi

      - name: Run adapter tests
        working-directory: monada-neuron
        run: ./gradlew --no-daemon :monada-neuron-resonance-adapter:test

      - name: Run evaluation integration tests
        # The integration source sets of monada-neuron-evaluation exist only with the Store sibling, so the verify
        # job cannot run them (Store integration, adapter boundary, routing replay, HTML knowledge ingestion).
        working-directory: monada-neuron
        run: ./gradlew --no-daemon :monada-neuron-evaluation:integrationTest

      - name: Verify embedded-host consumers
        working-directory: monada-neuron
        run: ./gradlew --no-daemon embeddedHostConsumerTest

      - name: Print Store provenance
        working-directory: monada-neuron
        run: cat build/integration-repo/STORE-PROVENANCE.txt

      - name: Upload adapter test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: adapter-test-reports
          path: |
            monada-neuron/**/build/reports/tests/**
            monada-neuron/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
