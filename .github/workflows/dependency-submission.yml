name: Dependency Submission

# Submits the Gradle dependency graph to GitHub's dependency graph (Dependabot alerts) with the project's Java 27
# toolchain. GitHub's automatic dependency submission runs on the runner's default JDKs, which do not include Java 27,
# and the build declares no toolchain download repository, so it cannot resolve the build; this workflow replaces it.
# Turn the automatic submission off in the repository settings (Code security > Dependency graph) so the two do not
# both submit.
#
# Only the core build is resolved: the optional Resonance Store adapter and the evaluation integration source sets
# exist only with the unpublished sibling Store checkout (ADR 0018), so their dependencies are not part of the graph.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Gradle dependency graph (Java 27)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to write the dependency graph snapshot.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
